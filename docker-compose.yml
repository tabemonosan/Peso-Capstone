services:
  mongo:
    image: mongo:8
    container_name: capstone-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 4000
      # Uses the bundled MongoDB container by default; override to point at Atlas, etc.
      MONGODB_URI: mongodb://mongo:27017/peso-capstone
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      # Email settings (optional — read from your host .env if present)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: capstone-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo-data:
